name: windows-smoke

# 目的：在真实 Windows 上验证插件可用性
#   1) 装进 profile  2) 被 dsh 加载（dump-config 条目数=1）  3) 版本号正确
# 不验证：浏览器界面、模型对话（需真机或虚拟机）。
#
# 历史：此前 `dsh` 在 pwsh 下静默失败（无输出、无报错、目录未创建）。
# 现在显式解析 dsh.cmd 并检查每一步 exit code。

on:
  push:
    branches: [main, master]
    paths:
      - "package.json"
      - "lib/**"
      - "cordis.patch.yml"
      - "scripts/**"
      - "install.ps1"
      - ".github/workflows/windows-smoke.yml"
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装宿主 DSH 0.2.1-rc.2
        shell: pwsh
        run: |
          npm i -g @deepseek-ai/dsh@0.2.1-rc.2
          if ($LASTEXITCODE -ne 0) { throw "npm i -g 失败: $LASTEXITCODE" }

      - name: 解析 dsh 可执行文件
        id: resolve
        shell: pwsh
        run: |
          Write-Host "--- 所有 dsh 候选 ---"
          Get-Command dsh -All -ErrorAction SilentlyContinue |
            Select-Object Name, CommandType, Source | Format-Table -AutoSize | Out-String | Write-Host

          # .ps1 包装器在非交互 pwsh 下可能不执行，优先用 .cmd
          $candidates = @(
            (Get-Command dsh.cmd -ErrorAction SilentlyContinue | Select-Object -First 1).Source,
            (Join-Path (npm prefix -g) "dsh.cmd"),
            (Join-Path (npm prefix -g) "dsh.ps1")
          ) | Where-Object { $_ -and (Test-Path $_) }

          if (-not $candidates) { throw "找不到 dsh 可执行文件" }
          $dsh = $candidates[0]
          Write-Host "选用: $dsh"

          # 直接 node 调用 bin.js，绕开 .cmd/.ps1 包装器
          $root = (npm root -g).Trim()
          $js = Join-Path $root "@deepseek-ai\dsh\lib\bin.js"
          if (-not (Test-Path $js)) { throw "找不到 dsh bin.js: $js" }
          Write-Host "bin.js: $js"

          "DSH_CMD=$dsh"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DSH_JS=$js"       | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DSH_HOME=$(Join-Path $env:USERPROFILE '.dsh')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 环境自检（cmd 直调，绕开 PowerShell 输出捕获）
        shell: cmd
        run: |
          echo === node 本体 ===
          node -e "console.log('NODE_OK', process.version)"
          echo exit=%ERRORLEVEL%
          echo.
          echo === dsh.cmd --version ===
          dsh.cmd --version
          echo exit=%ERRORLEVEL%
          echo.
          echo === node bin.js --version ===
          node "%DSH_JS%" --version
          echo exit=%ERRORLEVEL%

      - name: 宿主版本（pwsh 捕获对比，不阻断）
        shell: pwsh
        run: |
          $a = & $env:DSH_CMD --version 2>&1 | Out-String
          Write-Host "dsh.cmd   输出=[$($a.Trim())] exit=$LASTEXITCODE"
          $b = & node $env:DSH_JS --version 2>&1 | Out-String
          Write-Host "node bin.js 输出=[$($b.Trim())] exit=$LASTEXITCODE"
          if (-not $a.Trim() -and -not $b.Trim()) {
            Write-Host "::warning::两种方式均无输出，继续执行以观察 profile 是否创建"
          }

      - name: 打包插件
        shell: pwsh
        run: |
          npm pack
          if ($LASTEXITCODE -ne 0) { throw "npm pack 失败" }
          Get-ChildItem -Filter "dsh-purge-*.tgz" | Select-Object Name, Length

      - name: 生成 profile
        shell: pwsh
        run: |
          & node $env:DSH_JS --profile web --dump-config | Out-Null
          $code = $LASTEXITCODE
          Write-Host "dump-config exit: $code"

          $dir = Join-Path $env:DSH_HOME "profiles\web"
          if (-not (Test-Path $dir)) {
            Write-Host "dsh 未创建 profile，手动创建: $dir"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $env:DSH_HOME | Out-Null
            & node $env:DSH_JS --profile web --dump-config | Out-Null
          }

          if (-not (Test-Path $dir)) { throw "profile 仍不存在: $dir" }
          Write-Host "--- profile 内容 ---"
          Get-ChildItem $dir -Force | Select-Object -ExpandProperty Name | Write-Host

      - name: 诊断路径
        shell: pwsh
        run: |
          Write-Host "USERPROFILE = $env:USERPROFILE"
          Write-Host "DSH_HOME    = $env:DSH_HOME"
          Write-Host "DSH_CMD     = $env:DSH_CMD"
          Write-Host "--- .dsh 树 ---"
          if (Test-Path $env:DSH_HOME) {
            Get-ChildItem $env:DSH_HOME -Recurse -Depth 2 -Force |
              Select-Object -First 40 -ExpandProperty FullName | Write-Host
          } else { Write-Host "没有 .dsh 目录" }

      - name: 安装插件（npm 直装，绕开 dsh plugin）
        shell: pwsh
        run: |
          $profileDir = Join-Path $env:DSH_HOME "profiles\web"
          Set-Location $profileDir

          if (-not (Test-Path "package.json")) {
            '{"name":"dsh-profile-web","private":true,"version":"0.0.0","dependencies":{}}' |
              Set-Content -Encoding utf8 "package.json"
            Write-Host "已创建最小 package.json（dsh 自身未生成）"
          }

          $tgz = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "dsh-purge-*.tgz" | Select-Object -First 1
          if (-not $tgz) { throw "找不到 tgz 包" }
          Write-Host "installing $($tgz.Name) → $profileDir"

          # 不能用 --no-save：那样不会写进 package.json 的 dependencies，
          # 而 dsh 加载插件正是读这一项
          npm install --save --ignore-scripts $tgz.FullName 2>&1 | Select-Object -Last 8
          Write-Host "npm exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "npm install 失败: $LASTEXITCODE" }

          Write-Host "--- node_modules 顶层（前 10） ---"
          Get-ChildItem node_modules -ErrorAction SilentlyContinue | Select-Object -First 10 -ExpandProperty Name | Write-Host
          if (-not (Test-Path "node_modules\dsh-purge\package.json")) {
            throw "node_modules\dsh-purge 未就位"
          }
          Write-Host "dsh-purge 已就位"

      - name: 登记到 profile
        shell: pwsh
        run: |
          $profileDir = Join-Path $env:DSH_HOME "profiles\web"
          if (-not (Test-Path $profileDir)) { throw "profile 不存在：$profileDir" }
          Set-Location $profileDir
          node node_modules/dsh-purge/scripts/ensure-profile-bundle.mjs
          if ($LASTEXITCODE -ne 0) { throw "ensure-profile-bundle 失败: $LASTEXITCODE" }

      - name: 断言版本号
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:DSH_HOME "profiles\web")
          $v = node -p "require('./node_modules/dsh-purge/package.json').version"
          Write-Host "installed version: $v"
          if ($v -ne "1.1.71-rc2.1") { throw "版本不符：$v" }

      - name: 断言挂载（文件级，绕过 dump-config）
        shell: pwsh
        run: |
          $profile = Join-Path $env:DSH_HOME "profiles\web"

          $pkg = Join-Path $profile "node_modules\dsh-purge\package.json"
          if (-not (Test-Path $pkg)) { throw "dsh-purge 未安装到 node_modules" }
          $v = (Get-Content $pkg -Raw | ConvertFrom-Json).version
          Write-Host "dsh-purge version: $v"

          $profPkgPath = Join-Path $profile "package.json"
          $profPkg = Get-Content $profPkgPath -Raw | ConvertFrom-Json
          $dep = $profPkg.dependencies.'dsh-purge'
          Write-Host "profile dependencies.dsh-purge: $dep"
          if (-not $dep) { throw "profile 未声明 dsh-purge 依赖" }

          $patch = Join-Path $profile "cordis.patch.yml"
          if (Test-Path $patch) {
            $hit = Select-String -Path $patch -Pattern "dsh-purge" -SimpleMatch
            Write-Host "cordis.patch.yml 引用 dsh-purge: $($hit.Count) 处"
            if ($hit.Count -lt 1) { throw "cordis.patch.yml 未登记 dsh-purge" }
          } else {
            throw "缺少 cordis.patch.yml"
          }

          Write-Host "--- 尝试 dump-config（上游 Windows 问题，不阻断） ---"
          $cfg = & node $env:DSH_JS --profile web --dump-config 2>&1 | Out-String
          if ($cfg.Trim()) {
            $n = ([regex]::Matches($cfg, '(?m)^- id: dsh-purge$')).Count
            Write-Host "dump-config 条目数: $n"
            if ($n -ne 1) { Write-Host "::warning::dump-config 条目数异常，但文件级校验已通过" }
          } else {
            Write-Host "::warning::dump-config 在 Windows 上无输出（上游已知问题）"
          }

      - name: 关键文件存在性
        shell: pwsh
        run: |
          $base = Join-Path $env:DSH_HOME "profiles\web\node_modules\dsh-purge"
          foreach ($f in @("lib\identity.js", "lib\core.js", "cordis.patch.yml", "client.js", "bin\dsh-purge.js")) {
            if (-not (Test-Path (Join-Path $base $f))) { throw "缺少 $f" }
          }
          Write-Host "关键文件齐全"

      - name: 更新链接指向校验
        shell: pwsh
        run: |
          $f = Join-Path $env:DSH_HOME "profiles\web\node_modules\dsh-purge\lib\update.js"
          $repo = (Select-String -Path $f -Pattern '^const REPO = "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "update.js REPO = $repo"
          if ($repo -match "YuJunZhiXue|HunYiSage") {
            throw "REPO 仍指向第三方仓库：$repo"
          }

      - name: 端到端执行 install.ps1（模拟全新用户）
        shell: pwsh
        run: |
          Write-Host "=== 清空 DSH_HOME，模拟全新环境 ==="
          Remove-Item -Recurse -Force $env:DSH_HOME -ErrorAction SilentlyContinue
          Write-Host "  已删除: $env:DSH_HOME"

          Write-Host "=== 执行仓库根目录的 install.ps1 ==="
          $script = Join-Path $env:GITHUB_WORKSPACE "install.ps1"
          if (-not (Test-Path $script)) { throw "install.ps1 不存在" }
          & $script
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 退出码 $LASTEXITCODE" }

          Write-Host "=== 安装后独立验证 ==="
          $profile = Join-Path $env:DSH_HOME "profiles\web"
          $pkg = Join-Path $profile "node_modules\dsh-purge\package.json"
          if (-not (Test-Path $pkg)) { throw "脚本跑完但包不存在" }
          $v = (Get-Content $pkg -Raw | ConvertFrom-Json).version
          Write-Host "  version: $v"
          if ($v -ne "1.1.71-rc2.1") { throw "版本不符: $v" }

          $dep = (Get-Content (Join-Path $profile "package.json") -Raw | ConvertFrom-Json).dependencies.'dsh-purge'
          Write-Host "  dependencies.dsh-purge: $dep"
          if (-not $dep) { throw "依赖未声明" }

          Write-Host "=== install.ps1 端到端通过 ==="
